name: Pipeline de CI - Olá Mundo DevOps

# Define quando o pipeline deve rodar
on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

# Define os trabalhos (jobs) que o pipeline executará
jobs:
  # O nome do nosso job é "test-and-build"
  test-and-build:
    # A máquina virtual que o job usará
    runs-on: self-hosted

    permissions:
      contents: read # Permissão para fazer checkout do código
      packages: write # Permissão para FAZER PUSH de pacotes (imagem Docker)

    # Os passos (steps) que o job executará em sequência
    steps:
      # 1. Baixa o código do repositório para a máquina virtual
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # 3. Instala todas as dependências
      - name: Instalar Dependências
        run: npm install

      # 4. Executa os testes
      - name: Rodar Testes
        run: npm test

      # 5. Configura o Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Logar no GitHub Container Registry (GHCR)
      # Este step só roda quando houver um push na branch main
      - name: Logar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Extrair metadados (tags) para o Docker
      # Este step só roda quando houver um push na branch main
      - name: Extrair Metadados do Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      # 8. Build E PUSH da Imagem Docker
      # O push só acontece na branch main
      - name: Build e Push da Imagem Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

          # Usa as tags geradas pelo metadata-action
          tags: ${{ steps.meta.outputs.tags }}

          # Usa os labels gerados pelo metadata-action
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-local:
   # Este job SÓ RODA se for um push na 'main'
   if: github.event_name == 'push' && github.ref == 'refs/heads/main'

   # CORREÇÃO: Ele precisa que o Job 1 (test-and-build) termine com sucesso
   needs: test-and-build

   # Ele roda no seu PC (onde o runner está ouvindo)
   runs-on: self-hosted

   steps:
   # 1. Pega o código (para ter o docker-compose.yml)
   - name: Checkout do Código
     uses: actions/checkout@v4
   # 2. Loga no GHCR (para poder BAIXAR a imagem)
   - name: Logar no GitHub Container Registry (GHCR)
     uses: docker/login-action@v3
     with:
       registry: ghcr.io
       username: ${{ github.actor }}
       password: ${{ secrets.GITHUB_TOKEN }}
   # 3. Executa o Deploy
   - name: Fazer Deploy com Docker Compose
     run: |
       docker-compose pull
       docker-compose up -d --no-build
       docker image prune -f